<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity School BD — Coming Soon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f2a43 0%, #1a4a7a 45%, #2e86c1 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow-x: hidden;
  }

  .stars, .stars2, .stars3 { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .stars { background: transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><circle cx='20' cy='40' r='1' fill='white' opacity='0.8'/><circle cx='80' cy='20' r='1.2' fill='white' opacity='0.6'/><circle cx='150' cy='60' r='1' fill='white' opacity='0.9'/><circle cx='220' cy='30' r='0.8' fill='white' opacity='0.5'/><circle cx='270' cy='90' r='1.3' fill='white' opacity='0.7'/><circle cx='40' cy='120' r='0.8' fill='white' opacity='0.6'/><circle cx='120' cy='150' r='1.1' fill='white' opacity='0.8'/><circle cx='200' cy='130' r='0.9' fill='white' opacity='0.5'/><circle cx='280' cy='170' r='1' fill='white' opacity='0.7'/><circle cx='90' cy='220' r='1.2' fill='white' opacity='0.6'/><circle cx='180' cy='260' r='0.8' fill='white' opacity='0.8'/><circle cx='250' cy='230' r='1' fill='white' opacity='0.5'/><circle cx='60' cy='280' r='1.1' fill='white' opacity='0.7'/></svg>") repeat;
    animation: twinkle 8s linear infinite;
  }
  .stars2 { background: transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250'><circle cx='30' cy='80' r='0.7' fill='white' opacity='0.4'/><circle cx='110' cy='40' r='0.9' fill='white' opacity='0.5'/><circle cx='190' cy='90' r='0.7' fill='white' opacity='0.6'/><circle cx='240' cy='50' r='0.8' fill='white' opacity='0.4'/><circle cx='70' cy='180' r='0.9' fill='white' opacity='0.5'/><circle cx='160' cy='220' r='0.7' fill='white' opacity='0.6'/><circle cx='220' cy='190' r='0.8' fill='white' opacity='0.4'/><circle cx='50' cy='240' r='0.7' fill='white' opacity='0.5'/></svg>") repeat;
    animation: twinkle 11s linear infinite;
  }
  .stars3 { background: transparent url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><circle cx='100' cy='100' r='0.6' fill='white' opacity='0.3'/><circle cx='40' cy='160' r='0.8' fill='white' opacity='0.4'/><circle cx='170' cy='140' r='0.6' fill='white' opacity='0.3'/><circle cx='90' cy='60' r='0.7' fill='white' opacity='0.4'/></svg>") repeat;
    animation: twinkle 14s linear infinite;
  }

  @keyframes twinkle {
    from { background-position: 0 0; }
    to   { background-position: -300px 300px; }
  }

  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 30px;
    max-width: 720px;
    width: 92%;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
  }

  .logo {
    width: 88px; height: 88px;
    margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    background: linear-gradient(135deg, #f9e27a, #f5b041);
    color: #0f2a43;
    border-radius: 22px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
  }

  h1 {
    font-size: 34px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 15px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 22px;
  }

  .badge {
    display: inline-block;
    padding: 7px 18px;
    border-radius: 999px;
    background: rgba(244, 208, 63, 0.18);
    border: 1px solid rgba(244, 208, 63, 0.5);
    color: #f9e27a;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 26px;
  }

  .progress-track {
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 999px;
    overflow: hidden;
    margin: 0 auto 26px;
    max-width: 420px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #f9e27a, #f5b041);
    animation: fill 4.5s ease forwards infinite;
  }
  @keyframes fill {
    0%   { width: 0%; }
    55%  { width: 78%; }
    100% { width: 78%; }
  }

  .info { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 14px; }
  .info span { background: rgba(255,255,255,0.10); padding: 10px 16px; border-radius: 12px; }
  .info .lbl { display: block; font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 1px; }
  .info a { color: #f9e27a; text-decoration: none; }
  .info a:hover { text-decoration: underline; }

  .footer-note {
    margin-top: 26px;
    font-size: 12px;
    color: rgba(255,255,255,0.55);
  }

  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .card { padding: 30px 18px; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <div class="card">
    <div class="logo">&#127891;</div>
    <h1>Unity School BD</h1>
    <p class="tagline">Shaping bright minds, building a better tomorrow.</p>
    <div class="badge">Under Construction</div>

    <div class="progress-track"><div class="progress-fill"></div></div>

    <div class="info">
      <span>
        <span class="lbl">Email</span>
        <a href="mailto:info@unityschoolbd.com">info@unityschoolbd.com</a>
      </span>
      <span>
        <span class="lbl">Phone</span>
        +880 1XXX-XXXXXX
      </span>
    </div>

    <p class="footer-note">Our new website is being prepared. Thank you for your patience — we'll be live soon.</p>
  </div>
</body>
</html>
