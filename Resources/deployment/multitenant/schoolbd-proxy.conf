# /etc/nginx/snippets/schoolbd-proxy.conf: shared proxy settings for every school host.
client_max_body_size 20m;

location / {
    proxy_pass http://schoolbd_platform;
    proxy_http_version 1.1;

    # SignalR (/hubs/notifications) needs the upgrade headers.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The school is resolved from THIS header. Always the host nginx matched, never a client value.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
}

# Requires in the http {} block (nginx.conf), once:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
