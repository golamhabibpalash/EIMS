# ============================================================================
# SchoolBD multi-tenant platform: ONE app process serves every school.
# /etc/nginx/sites-available/schoolbd-platform  (then symlink into sites-enabled, nginx -t, reload)
#
# Security notes
# - The app identifies the school ONLY from the Host header, matched against the domain registry.
#   nginx must pass the original $host and must never forward a client-supplied X-Forwarded-Host.
# - Requests whose Host is not *.schoolbd.net or a known custom domain hit the default server and are
#   dropped (444) before they reach the app.
# - Cloudflare: if the record is proxied (orange cloud), restore the real client IP with
#   set_real_ip_from <Cloudflare ranges> + real_ip_header CF-Connecting-IP (see docs/DEPLOYMENT notes).
# ============================================================================

upstream schoolbd_platform {
    server 127.0.0.1:5100;   # Kestrel, see schoolbd-platform.env (ASPNETCORE_URLS)
    keepalive 32;
}

# Drop anything that is not one of our hosts (raw IP, random Host headers).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# HTTP -> HTTPS for every school.
server {
    listen 80;
    server_name .schoolbd.net;          # add custom domains here too, or use a map/include
    return 301 https://$host$request_uri;
}

# All platform subdomains: one wildcard certificate (Let's Encrypt DNS-01 via the Cloudflare API).
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
#       -d 'schoolbd.net' -d '*.schoolbd.net'
server {
    listen 443 ssl;
    http2 on;
    server_name *.schoolbd.net;

    ssl_certificate     /etc/letsencrypt/live/schoolbd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schoolbd.net/privkey.pem;

    include /etc/nginx/snippets/schoolbd-proxy.conf;
}

# Custom domains (abcschool.edu.bd): one server block (or include file) per verified domain, each
# with its own certificate (HTTP-01 works once the school's DNS points here). Register the domain
# with `platform domain-add` first; it stays inactive until `platform domain-verify` succeeds.
# include /etc/nginx/schoolbd-custom-domains/*.conf;
