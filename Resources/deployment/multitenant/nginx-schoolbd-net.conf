# ============================================================================
# SchoolBD multi-tenant platform: ONE app (schoolbd-platform.service, 127.0.0.1:5100)
# serves every school at <code>.schoolbd.net.
#   /etc/nginx/sites-available/schoolbd-platform -> sites-enabled, then nginx -t && systemctl reload nginx
#
# - The app picks the school ONLY from the Host header (registry lookup), so nginx passes the
#   original $host and blanks any client X-Forwarded-Host.
# - No default_server here on purpose: this VPS hosts other sites, and taking over the catch-all
#   would change how they answer unknown hosts. Unknown *.schoolbd.net names get the app's 404.
# - Certificate: wildcard via Let's Encrypt DNS-01 (Cloudflare API token, auto-renewed by certbot):
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare-schoolbd.ini \
#       --cert-name schoolbd.net -d '*.schoolbd.net'
# - The apex schoolbd.net is NOT served here: it is reserved for the separate SchoolBD website.
# ============================================================================

# WebSocket upgrade for SignalR (/hubs/notifications); own variable name to avoid clashing with other sites.
map $http_upgrade $schoolbd_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name *.schoolbd.net;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.schoolbd.net;

    ssl_certificate     /etc/letsencrypt/live/schoolbd.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schoolbd.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_schoolbd:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $schoolbd_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
}
