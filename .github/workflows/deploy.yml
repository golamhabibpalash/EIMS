name: Deploy EIMS

# One release branch, one commit, every instance.
#
#   push to FinalDeployment ............ deploys ALL instances automatically
#   Actions -> Deploy EIMS -> Run workflow -> pick an instance ... just that one
#
# Instances (GitHub Settings -> Environments; names must match exactly):
#
#   DMCPS          https://eims.mcpsbd.com           Windows shared hosting (IIS/Plesk)
#   Unityschoolbd  https://eims.unityschoolbd.com    Windows shared hosting (IIS/Plesk)
#   Curiosity      https://curiosity.mcpsbd.com      Windows shared hosting (IIS/Plesk)
#   SchoolBD       https://schoolbd.hekzor.com       Linux VPS (systemd + nginx)
#
# Windows instances get a SELF-CONTAINED win-x64 package over FTP, so they never
# depend on which .NET runtime the host happens to have installed.
#   secrets: FTP_SERVER  FTP_USERNAME  FTP_PASSWORD  FTP_PATH
#   vars:    SITE_URL
#
# The Linux instance builds on the box: CI runs Resources/deployment/eims-deploy.sh
# over SSH for the exact commit being released (backup, swap, restart, health check).
#   secrets: SSH_HOST  SSH_USER  SSH_KEY   (SSH_USER needs passwordless sudo)
#   vars:    SITE_URL
#
# Never touched on any server: appsettings*.json, Keys/, logs/, App_Data/ (admission
# uploads), wwwroot/Uploads/, and uploaded images. A server's own web.config is kept;
# only its processPath is pointed at the self-contained SMS_App.exe when needed.
#
# Every deploy ends by reading <SITE_URL>/build-info and FAILS unless the instance
# reports the commit that was just shipped.

on:
  push:
    branches: [FinalDeployment]
  workflow_dispatch:
    inputs:
      client:
        description: "Instance to deploy"
        required: true
        default: all
        type: choice
        options:
          - all
          - DMCPS
          - Unityschoolbd
          - Curiosity
          - SchoolBD

# Two releases must never interleave on the same servers.
concurrency:
  group: deploy-eims
  cancel-in-progress: false

jobs:
  # 1. Decide which instances this run targets ------------------------------
  setup:
    runs-on: [self-hosted, eims]
    outputs:
      windows: ${{ steps.pick.outputs.windows }}
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - id: pick
        shell: bash
        run: |
          # Production only ever runs FinalDeployment, even if "Run workflow" is started
          # from another branch in the GitHub UI.
          if [ "$GITHUB_REF" != "refs/heads/FinalDeployment" ]; then
            echo "::error::Deploys run only from FinalDeployment (this run is on $GITHUB_REF). Pick FinalDeployment under 'Use workflow from'."
            exit 1
          fi
          windows=(DMCPS Unityschoolbd Curiosity)
          linux=(SchoolBD)
          sel="${{ github.event.inputs.client }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ -z "$sel" ] || [ "$sel" = "all" ]; then
            win_sel=("${windows[@]}"); lin_sel=("${linux[@]}")
          else
            win_sel=(); lin_sel=()
            [[ " ${windows[*]} " == *" $sel "* ]] && win_sel=("$sel")
            [[ " ${linux[*]} " == *" $sel "* ]] && lin_sel=("$sel")
          fi
          to_json() { local out="" x; for x in "$@"; do out+="${out:+,}\"$x\""; done; echo "[$out]"; }
          echo "windows=$(to_json "${win_sel[@]}")" >> "$GITHUB_OUTPUT"
          echo "linux=$(to_json "${lin_sel[@]}")" >> "$GITHUB_OUTPUT"
          echo "Windows: ${win_sel[*]:-none}   Linux: ${lin_sel[*]:-none}"

  # 2. Build the Windows package ONCE (also proves the commit compiles) -----
  build:
    needs: setup
    runs-on: [self-hosted, eims]
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.meta.outputs.git_commit }}
    steps:
      - uses: actions/checkout@v4

      # Use the VPS's own .NET 8 SDK. actions/setup-dotnet installs into /usr/share/dotnet,
      # which the unprivileged runner user can't write to, and the default `dotnet` on
      # this host (/usr/bin/dotnet) is a separate .NET 10-only install.
      - name: Use the server's .NET 8 SDK
        shell: bash
        run: |
          echo "DOTNET_ROOT=/usr/share/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          echo "DOTNET_NOLOGO=1" >> "$GITHUB_ENV"
          echo "/usr/share/dotnet" >> "$GITHUB_PATH"
          /usr/share/dotnet/dotnet --version

      - name: Build metadata
        id: meta
        shell: bash
        run: |
          echo "git_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_utc=$(date -u '+%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish SMS_App/SMS_App.csproj -c Release -o ./publish --nologo
          --runtime win-x64 --self-contained true
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -p:BuildNumber=${{ github.run_number }}
          -p:GitCommit=${{ steps.meta.outputs.git_commit }}
          -p:BuildTimestampUtc="${{ steps.meta.outputs.built_utc }}"

      - name: Strip files that must never leave the build server
        shell: bash
        run: |
          rm -f  ./publish/appsettings*.json   # per-instance config lives on each server
          rm -f  ./publish/web.config          # each server keeps its own (see deploy step)
          rm -f  ./publish/*.pdb
          rm -rf ./publish/publish ./publish/wwwroot/Images

      - name: Package
        shell: bash
        run: tar -czf eims-win-x64.tgz -C publish .

      - uses: actions/upload-artifact@v4
        with:
          name: eims-win-x64
          path: eims-win-x64.tgz
          retention-days: 3
          if-no-files-found: error

  # 3a. Windows / IIS instances (FTP) ---------------------------------------
  deploy-windows:
    needs: [setup, build]
    if: needs.setup.outputs.windows != '[]'
    runs-on: [self-hosted, eims]
    timeout-minutes: 120        # a first deploy uploads the whole runtime; later ones are small
    environment: ${{ matrix.client }}
    strategy:
      fail-fast: false          # one instance failing must not block the others
      max-parallel: 2
      matrix:
        client: ${{ fromJSON(needs.setup.outputs.windows) }}
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}   # read by lftp --env-password; keeps it out of `ps`
      FTP_PATH: ${{ secrets.FTP_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Resources/deployment

      - uses: actions/download-artifact@v4
        with:
          name: eims-win-x64

      - name: Unpack
        shell: bash
        run: rm -rf publish && mkdir publish && tar -xzf eims-win-x64.tgz -C publish

      - name: Check secrets
        shell: bash
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_PATH; do
            [ -n "${!v}" ] || { echo "::error::Environment ${{ matrix.client }} is missing secret $v"; exit 1; }
          done

      # Resolves the FTP folder that really contains the app, then proves it is writable.
      # Plesk FTP users are often chrooted to httpdocs (so FTP_PATH must be "/") while the
      # main subscription user sees httpdocs as a subfolder (so FTP_PATH must be "/httpdocs").
      # Trying the candidates here means one bad secret can no longer fail later, mid-release.
      - name: Resolve FTP path, verify writability + prepare web.config
        id: ftp
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -uo pipefail
          rm -f server-web.config remote-check.txt

          candidates=()
          [ -n "${FTP_PATH:-}" ] && candidates+=("$FTP_PATH")
          candidates+=( "/" "/httpdocs" "httpdocs" )
          if [ -n "${SITE_URL:-}" ]; then
            domain="$(printf '%s' "$SITE_URL" | sed -E 's#^[a-z]+://##; s#/.*$##')"
            [ -n "$domain" ] && candidates+=("/$domain/httpdocs" "$domain/httpdocs")
          fi

          resolved=""
          for p in "${candidates[@]}"; do
            out="$(lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" 2>&1 <<EOF || true
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 2
          set cmd:fail-exit yes
          cd "$p"
          pwd
          cls -1 SMS_App.dll
          bye
          EOF
          )"
            # cmd:fail-exit makes a bad `cd` abort before `cls`, so a match here proves the
            # directory was entered - not that SMS_App.dll merely exists in the login home.
            if printf '%s\n' "$out" | grep -qx "SMS_App.dll"; then
              resolved="$(printf '%s\n' "$out" | grep -E '^/' | head -n1)"
              resolved="${resolved:-$p}"
              echo "FTP path '$p' contains SMS_App.dll (pwd: $resolved)."
              break
            fi
          done

          if [ -z "$resolved" ]; then
            echo "::error::No SMS_App.dll found via FTP on $FTP_SERVER. Tried: ${candidates[*]}. Check FTP_PATH / the FTP user's home directory. Nothing was changed."
            exit 1
          fi
          echo "ftp_path=$resolved" >> "$GITHUB_OUTPUT"

          # Fail now - before app_offline.htm - if the account cannot write to that folder.
          probe=".eims-write-test-$$"
          printf 'ok\n' > "$probe"
          if ! lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" 2>&1 <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 30
          set cmd:fail-exit yes
          cd "$resolved"
          put "$probe" -o "$probe"
          rm -f "$probe"
          bye
          EOF
          then
            rm -f "$probe"
            echo "::error::FTP user cannot write to '$resolved' on $FTP_SERVER. Fix the account's permissions/home directory. Nothing was changed."
            exit 1
          fi
          rm -f "$probe"
          echo "FTP path '$resolved' is writable."

          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" 2>&1 <<EOF || true
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 30
          set cmd:fail-exit yes
          cd "$resolved"
          get web.config -o server-web.config
          bye
          EOF
          if [ -s server-web.config ]; then
            cp server-web.config web.config
            # Self-contained package: IIS must start SMS_App.exe, not "dotnet SMS_App.dll".
            # Everything else in the server's file (env vars, logging) is preserved.
            perl -pi -e 's/processPath="[^"]*"/processPath=".\\SMS_App.exe"/; s/\barguments="[^"]*"/arguments=""/' web.config
            if cmp -s server-web.config web.config; then
              echo "Server web.config already targets SMS_App.exe - leaving it alone."
              rm -f web.config
            else
              echo "Server web.config will be updated:"; diff server-web.config web.config || true
            fi
          else
            echo "No web.config on the server - using the repo template."
            cp Resources/deployment/unityschoolbd/web.config web.config
          fi

      # Most of the transfer happens while the site is still serving users. Safe because:
      #  - files missing on the server (e.g. the bundled .NET runtime on a first deploy)
      #    are not loaded by the running app, and
      #  - wwwroot holds static files IIS never locks.
      # The offline window below then only has to swap the app's own DLLs/config.
      - name: Pre-stage new files (site stays online)
        shell: bash
        run: |
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 120
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set ftp:use-site-chmod no
          set ftp:use-site-utime no
          set file:charset utf-8
          cd "${{ steps.ftp.outputs.ftp_path }}"
          mirror -R --only-missing --no-perms --no-umask \
            --exclude-glob app_offline.htm \
            --exclude-glob appsettings*.json \
            --exclude-glob web.config \
            --exclude-glob *.pdb \
            --exclude Keys/ \
            --exclude logs/ \
            --exclude App_Data/ \
            --exclude wwwroot/ \
            --parallel=4 \
            ./publish/ .
          mirror -R --no-perms --no-umask \
            --exclude Uploads/ \
            --exclude Images/ \
            --parallel=4 \
            ./publish/wwwroot/ wwwroot
          bye
          EOF

      - name: Take the app offline
        shell: bash
        run: |
          cat > app_offline.htm <<'EOF'
          <!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>System Maintenance</title><style>
          body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;text-align:center;
          padding:50px 20px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;
          margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
          .card{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);padding:40px;
          border-radius:15px;box-shadow:0 8px 32px rgba(0,0,0,.1);max-width:500px}
          h1{margin:0 0 20px;font-size:2em}p{font-size:1.1em;margin:10px 0}
          .spin{border:4px solid rgba(255,255,255,.3);border-top:4px solid #fff;border-radius:50%;
          width:40px;height:40px;animation:s 1s linear infinite;margin:20px auto}
          @keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="card">
          <h1>&#128295; System Maintenance</h1><div class="spin"></div>
          <p>We're updating the system with the latest improvements.</p>
          <p><small>This will only take a moment. Please refresh in a few seconds.</small></p>
          </div></body></html>
          EOF
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          set cmd:fail-exit yes
          cd "${{ steps.ftp.outputs.ftp_path }}"
          put app_offline.htm -o app_offline.htm
          bye
          EOF
          sleep 10   # give IIS time to shut the app down and release the DLL locks

      - name: Upload the release
        shell: bash
        run: |
          # mirror -R without --delete: server-only files are never removed, and lftp
          # only sends files whose size/timestamp changed after the first run.
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 120
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 1
          set ftp:use-site-chmod no
          set ftp:use-site-utime no
          set file:charset utf-8
          set cmd:fail-exit yes
          cd "${{ steps.ftp.outputs.ftp_path }}"
          mirror -R --verbose --no-perms --no-umask \
            --exclude-glob app_offline.htm \
            --exclude-glob appsettings*.json \
            --exclude-glob web.config \
            --exclude-glob *.pdb \
            --exclude Keys/ \
            --exclude logs/ \
            --exclude App_Data/ \
            --exclude wwwroot/Uploads/ \
            --exclude wwwroot/Images/ \
            --parallel=3 \
            ./publish/ .
          bye
          EOF
          if [ -f web.config ]; then
            lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set cmd:fail-exit yes
          cd "${{ steps.ftp.outputs.ftp_path }}"
          put web.config -o web.config
          bye
          EOF
          fi

      - name: Bring the app back online
        if: always()
        shell: bash
        run: |
          # Nothing was taken offline if the path could not be resolved.
          [ -n "${{ steps.ftp.outputs.ftp_path }}" ] || exit 0
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" <<EOF
          set ftp:passive-mode on
          set ssl:verify-certificate no
          set net:timeout 30
          set cmd:fail-exit yes
          cd "${{ steps.ftp.outputs.ftp_path }}"
          rm -f app_offline.htm
          bye
          EOF

      - name: Verify the new build is live
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED: ${{ needs.build.outputs.commit }}
        run: bash Resources/deployment/verify-build.sh "$SITE_URL" "$EXPECTED"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf publish eims-win-x64.tgz app_offline.htm web.config server-web.config remote-check.txt

  # 3b. Linux VPS instance (on-box build over SSH) --------------------------
  deploy-linux:
    needs: [setup, build]       # only runs once the commit is known to compile
    if: needs.setup.outputs.linux != '[]'
    runs-on: [self-hosted, eims]
    timeout-minutes: 30
    environment: ${{ matrix.client }}
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.setup.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Resources/deployment

      - name: Deploy over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          for v in SSH_HOST SSH_USER SSH_KEY; do
            [ -n "${!v}" ] || { echo "::error::Environment ${{ matrix.client }} is missing secret $v"; exit 1; }
          done
          key="$(mktemp)"; trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"; chmod 600 "$key"
          # Runs the repo's copy of the script, so server and repo never drift apart. It is
          # copied to a file first and run with stdin closed: piping it into `bash -s` lets
          # any command inside that reads stdin swallow the rest of the script.
          ssh -i "$key" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" \
            'f=$(mktemp /tmp/eims-deploy.XXXXXX) && cat > "$f" && sudo -n bash "$f" '"${{ github.sha }} ${{ github.run_number }}"' </dev/null; rc=$?; rm -f "$f"; exit $rc' \
            < Resources/deployment/eims-deploy.sh

      - name: Verify the new build is live
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash Resources/deployment/verify-build.sh "$SITE_URL" "${{ github.sha }}"

  # 4. One summary table for the whole release ------------------------------
  summary:
    needs: [setup, build, deploy-windows, deploy-linux]
    if: always()
    runs-on: [self-hosted, eims]
    steps:
      - shell: bash
        run: |
          {
            echo "### EIMS release ${{ needs.build.outputs.commit }} (build ${{ github.run_number }})"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Windows: ${{ needs.setup.outputs.windows }} | ${{ needs.deploy-windows.result }} |"
            echo "| Linux: ${{ needs.setup.outputs.linux }} | ${{ needs.deploy-linux.result }} |"
            echo ""
            echo "Per-instance details are in each deploy job's log."
          } >> "$GITHUB_STEP_SUMMARY"
